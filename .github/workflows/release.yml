# Release — build CAUSEWAYBAY OFFICE for macOS and Linux and attach it to a
# GitHub release.
#
# Triggered by pushing a tag like `v0.1.0` on main, which must match the
# version of record (`VERSION`, printed by `make version`). Or manually via
# workflow_dispatch for a dry run that uploads the artifacts without creating
# a release.
#
#   macos-latest  → CausewaybayOffice-<version>-<arch>-apple-darwin.zip
#                   a double-clickable .app with LÖVE 11.5 and libcbo_core
#                   inside, signed, notarised and stapled when the secrets
#                   are present
#                 → CausewaybayOffice-<version>-<arch>-apple-darwin-portable.tar.gz
#   ubuntu-24.04  → CausewaybayOffice-<version>-<arch>-linux-portable.tar.gz
#                   the .love, libcbo_core.so and a launcher; needs LÖVE 11
#
# The recipe is the Makefile's (`make app`, `make notarize`, `make package`).
# Everything here is credentials and plumbing, so that a laptop and a tagged
# release do the same thing.
#
# Signing uses the Developer ID certificate from the repository secrets
# (MACOS_CERTIFICATE_P12_BASE64 / MACOS_CERTIFICATE_PASSWORD) and notarisation
# uses APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / TEAM_ID — the same names
# CausewaybayWallet uses, so one set of secrets covers both. Without them the
# app is ad-hoc signed and a dry run still produces every artifact.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  # A tag that disagrees with VERSION is a mistake worth stopping for, not
  # shipping. Resolved once, here, and handed to every packaging job.
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(make version)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match the version of record $version" >&2
            echo "bump VERSION, or retag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only a commit on main gets released; a tag on a side branch is a
      # dry run at most.
      - name: Tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag ${{ github.ref_name }} is not on main" >&2; exit 1; }

  macos:
    name: Package (macOS)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Install LuaJIT
        run: brew install luajit

      - name: Arch
        id: arch
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      # Imports the Developer ID certificate into a throwaway keychain and
      # exports APPLE_SIGNING_IDENTITY for `make app-sign`. Falls back to
      # ad-hoc signing when the secret is absent (a fork's dry run).
      - name: Import codesigning certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12_BASE64 not set, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" || true)
          if [ -n "$CERT_INFO" ]; then
            CERT_ID=$(echo "$CERT_INFO" | head -1 | awk -F'"' '{print $2}')
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
            echo "Found certificate: $CERT_ID"
          else
            echo "::warning::No Developer ID Application certificate found, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # The portable bundle first, smoke-tested headlessly; the same core
      # then goes into the .app.
      - run: make package-smoke LUAJIT=luajit

      # `make app` downloads LÖVE, embeds the game, builds the icon, signs
      # inside-out and checks the archive carries every module. The smoke
      # test that starts the bundle is skipped: a runner has no window server.
      - name: Build and sign the app
        run: make app SKIP_SMOKE=1 LUAJIT=luajit

      # Only with a real certificate: Apple refuses an ad-hoc signature.
      - name: Notarize and staple
        if: env.APPLE_SIGNING_IDENTITY != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: make notarize

      # Printed either way: "signed but not notarised" is the state worth
      # seeing in a log.
      - name: Assess with Gatekeeper
        run: make gatekeeper

      - name: Name the archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ steps.arch.outputs.arch }}
        run: |
          mkdir -p artifacts
          cp love2d/build/CausewaybayOffice-macos.zip \
            "artifacts/CausewaybayOffice-$VERSION-$ARCH-apple-darwin.zip"
          # COPYFILE_DISABLE keeps macOS from smuggling ._ resource forks in.
          COPYFILE_DISABLE=1 tar -czf \
            "artifacts/CausewaybayOffice-$VERSION-$ARCH-apple-darwin-portable.tar.gz" \
            -C dist CausewaybayOffice
          ls -lh artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CausewaybayOffice-macos-${{ steps.arch.outputs.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"

  linux:
    name: Package (Linux, portable)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit zip unzip

      - run: make package-smoke LUAJIT=luajit

      - name: Name the archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/CausewaybayOffice-$VERSION-$(uname -m)-linux-portable.tar.gz" \
            -C dist CausewaybayOffice
          ls -lh artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CausewaybayOffice-linux
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [version, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts && shasum -a 256 *.zip *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            CAUSEWAYBAY OFFICE ${{ needs.version.outputs.version }} — a retro
            8-bit terminal SSH client.

            | archive | what is inside |
            | --- | --- |
            | `CausewaybayOffice-…-apple-darwin.zip` | a double-clickable `.app` with LÖVE 11.5 and the Rust core inside |
            | `CausewaybayOffice-…-apple-darwin-portable.tar.gz` | the `.love`, `libcbo_core.dylib` and a launcher; needs LÖVE 11.5 installed |
            | `CausewaybayOffice-…-linux-portable.tar.gz` | the `.love`, `libcbo_core.so` and a launcher; needs LÖVE 11.5 installed |

            Verify a download against `SHA256SUMS`, then on macOS unzip and
            open the app, or elsewhere:

            ```sh
            tar -xzf CausewaybayOffice-*-portable.tar.gz
            ./CausewaybayOffice/CausewaybayOffice
            ```
